changeLogFile=changelog/tenant.changelog-master.xml
# Local default; kabipay-svc/scripts/provision-tenant.ps1 writes a temp file with host/port/SSL for cloud.
url=jdbc:postgresql://localhost:5432/kabipay_dev
username=${KABIPAY_DB_USER}
password=${KABIPAY_DB_PASSWORD}
driver=org.postgresql.Driver
logLevel=INFO
# Tenant schema is passed at runtime:  -Dschema=tenant_<id>
# Changelog tracking table is isolated per tenant:  -DdatabaseChangeLogTable=<schema>_databasechangelog
defaultSchemaName=${schema}
liquibase.hub.mode=off
