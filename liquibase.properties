changeLogFile=changelog/db.changelog-master.xml
# Default URL (local). `npm run migrate-ops` passes --url for cloud. For Aiven: sslmode=require in the JDBC URL.
url=jdbc:postgresql://localhost:5432/kabipay_dev
username=${KABIPAY_DB_USER}
password=${KABIPAY_DB_PASSWORD}
defaultSchemaName=kabipay_ops
# Liquibase history table must live in an existing schema; kabipay_ops is created by migration 0000-001.
liquibaseSchemaName=public
driver=org.postgresql.Driver
logLevel=INFO
